
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Beyond the Outbreak | DayZ</title>
  <style>
    body {
      margin: 0;
      background: #101411;
      color: #eee;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    header {
      padding: 90px 20px;
      background: linear-gradient(#202b23, #101411);
    }
    h1 {
      font-size: clamp(32px, 6vw, 64px);
      letter-spacing: 3px;
    }
    p { color: #b7beb7; }
    .button {
      display: inline-block;
      padding: 14px 25px;
      margin: 10px;
      background: #849d55;
      color: #101411;
      text-decoration: none;
      font-weight: bold;
      border-radius: 5px;
    }
    section { padding: 45px 20px; }
    .card {
      background: #1d251f;
      margin: 15px auto;
      padding: 24px;
      border-radius: 8px;
      max-width: 500px;
    }
  </style>
</head>
<body>
  <header>
    <h1>BEYOND THE OUTBREAK</h1>
    <p>Survive. Adapt. Overcome.</p>
    <a class="button" href="#servers">Our Servers</a>
  </header>

  <section id="servers">
    <h2>OUR DAYZ SERVERS</h2>
    <div class="card">
      <h3>Deer Isle</h3>
      <p>PVE Survival Experience</p>
    </div>
    <div class="card">
      <h3>Pripyat</h3>
      <p>Hardcore Survival</p>
    </div>
    <div class="card">
      <h3>Swans Island</h3>
      <p>Vanilla-Style PVP</p>
    </div>
  </section>

  <section>
    <h2>JOIN THE COMMUNITY</h2>
    <p>Connect with survivors and stay updated.</p>
    <p>Add your Discord invite link here.</p>
  </section>
</body>
</html>
